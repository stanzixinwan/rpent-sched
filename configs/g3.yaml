# G3: does planner intent beat FIFO and history when ordering queued model requests?
# Plan and rationale: project doc claude/G3计划.md.
#
#   bash scripts/launch_services.sh
#   bash scripts/run_g3.sh            # every mode x N x repeat, resumable
#   python analysis/g3_compare.py results/g3/<stamp>
#
# One run = 32 episodes (16 Flash tasks x seeds 0, 1), each exactly once, in the
# same order for every mode. Modes (rsched/intent.py): none (FIFO),
# intent_srpt, intent_lrpt, history_srpt, history_lrpt. The VLA and Molmo
# proxies use the `priority` policy in every mode; with mode none no request
# carries a priority, so they serve in arrival order (FIFO) on the same code path.
name: g3

rpent:
  robot: libero
  libero_type: pro
  planner: flash
  cuda_device: 0
  extra_args: ["--memory-version", "GPT_5.5_xhigh"]

services:
  vla:
    backend: http://127.0.0.1:9000
    policy: priority
    max_inflight: 1
  sam3:
    backend: http://127.0.0.1:9001
    policy: passthrough
  molmo:
    backend: http://127.0.0.1:9002
    policy: priority   # serialized by the server's own lock; queue here instead
    max_inflight: 1

scheduling:
  mode: none           # overridden per run: python -m rsched.sweep ... --sched <mode>
  costs: {}            # seconds per unit; defaults in rsched/intent.py (G2, N=1)

# Thread caps: see README, "CPU threads".
episode_env:
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1

episodes:
  # 4 per swap suite, chosen for spread in pi0 calls, chunk budget, and Molmo
  # anchors (project doc claude/G3计划.md). Suites interleaved; seeds 0 then 1.
  list:
    - {suite: libero_10_swap,       task: 0, seed: 0}
    - {suite: libero_goal_swap,     task: 1, seed: 0}
    - {suite: libero_object_swap,   task: 0, seed: 0}
    - {suite: libero_spatial_swap,  task: 0, seed: 0}
    - {suite: libero_10_swap,       task: 3, seed: 0}
    - {suite: libero_goal_swap,     task: 3, seed: 0}
    - {suite: libero_object_swap,   task: 2, seed: 0}
    - {suite: libero_spatial_swap,  task: 1, seed: 0}
    - {suite: libero_10_swap,       task: 4, seed: 0}
    - {suite: libero_goal_swap,     task: 5, seed: 0}
    - {suite: libero_object_swap,   task: 4, seed: 0}
    - {suite: libero_spatial_swap,  task: 3, seed: 0}
    - {suite: libero_10_swap,       task: 8, seed: 0}
    - {suite: libero_goal_swap,     task: 7, seed: 0}
    - {suite: libero_object_swap,   task: 9, seed: 0}
    - {suite: libero_spatial_swap,  task: 7, seed: 0}
    - {suite: libero_10_swap,       task: 0, seed: 1}
    - {suite: libero_goal_swap,     task: 1, seed: 1}
    - {suite: libero_object_swap,   task: 0, seed: 1}
    - {suite: libero_spatial_swap,  task: 0, seed: 1}
    - {suite: libero_10_swap,       task: 3, seed: 1}
    - {suite: libero_goal_swap,     task: 3, seed: 1}
    - {suite: libero_object_swap,   task: 2, seed: 1}
    - {suite: libero_spatial_swap,  task: 1, seed: 1}
    - {suite: libero_10_swap,       task: 4, seed: 1}
    - {suite: libero_goal_swap,     task: 5, seed: 1}
    - {suite: libero_object_swap,   task: 4, seed: 1}
    - {suite: libero_spatial_swap,  task: 3, seed: 1}
    - {suite: libero_10_swap,       task: 8, seed: 1}
    - {suite: libero_goal_swap,     task: 7, seed: 1}
    - {suite: libero_object_swap,   task: 9, seed: 1}
    - {suite: libero_spatial_swap,  task: 7, seed: 1}

concurrency: [8, 16]
episodes_per_level: 32
repeats: 1
episode_timeout_s: 3600
arrival: {mode: closed}
gpu_sampler: true
gpu_interval_s: 0.5
