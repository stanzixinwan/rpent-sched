  sam3:
    backend: http://127.0.0.1:9001
    policy: passthrough
  molmo:
    backend: http://127.0.0.1:9002
    policy: priority
    max_inflight: 1

scheduling:
  mode: none

episode_env:
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1

episodes:
