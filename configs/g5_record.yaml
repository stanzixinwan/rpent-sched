# G5 step 1: record every Flash task once (seed 0) at N=8.
# Gives (a) the per-task history table ("task -> last measured wall time")
# that the history baselines in g5_heldout.yaml use, and (b) a 78-task
# library for the trace-driven simulator. Also warms the services up.
# Run through scripts/run_g5.sh. Plans: RLinf/RPent-memory, GPT_5.5_xhigh/flash
# (78 tasks; goal_swap t0 and 10_swap t9 have none). Suites interleaved.
name: g5_record

rpent:
  robot: libero
  libero_type: pro
  planner: flash
  cuda_device: 0
  extra_args: ["--memory-version", "GPT_5.5_xhigh"]

services:
  vla:
    backend: http://127.0.0.1:9000
    policy: priority
    max_inflight: 1
  sam3:
    backend: http://127.0.0.1:9001
    policy: passthrough
  molmo:
    backend: http://127.0.0.1:9002
    policy: priority
    max_inflight: 1

services:
  vla:
    backend: http://127.0.0.1:9000
    policy: priority
    max_inflight: 1
  sam3:
    backend: http://127.0.0.1:9001
    policy: passthrough
  molmo:
    backend: http://127.0.0.1:9002
    policy: priority
    max_inflight: 1

services:
