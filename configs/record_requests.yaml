# Records real model requests for the single-model profiling (scripts/run_model_profile.sh).
#
# 16 plan-replay episodes (the 16 held-out tasks of G5, seed 1) at N=4. The proxies
# save the first request bodies of every episode: up to 40 vla.predict, 10
# molmo.ground and 10 sam3.segment each, under <out>/N4_r0/requests/<service>/.
# rsched.bench_models replays them one at a time against a profiled server.
name: record_requests
rpent:
  robot: libero
  libero_type: pro
  planner: flash
  cuda_device: 0
  extra_args: [--memory-version, GPT_5.5_xhigh]
services:
  vla: {backend: 'http://127.0.0.1:9000', policy: fifo, max_inflight: 1, dump_per_episode: 40}
  sam3: {backend: 'http://127.0.0.1:9001', policy: passthrough, dump_per_episode: 10}
  molmo: {backend: 'http://127.0.0.1:9002', policy: fifo, max_inflight: 1, dump_per_episode: 10}
episode_env: {OMP_NUM_THREADS: 1, MKL_NUM_THREADS: 1, OPENBLAS_NUM_THREADS: 1, NUMEXPR_NUM_THREADS: 1}
episodes:
  list:
  - {suite: libero_10_swap, task: 1, seed: 1}
  - {suite: libero_goal_swap, task: 2, seed: 1}
  - {suite: libero_object_swap, task: 5, seed: 1}
  - {suite: libero_spatial_swap, task: 4, seed: 1}
  - {suite: libero_10_task, task: 2, seed: 1}
  - {suite: libero_goal_task, task: 2, seed: 1}
  - {suite: libero_object_task, task: 4, seed: 1}
  - {suite: libero_spatial_task, task: 1, seed: 1}
  - {suite: libero_10_swap, task: 6, seed: 1}
  - {suite: libero_goal_swap, task: 9, seed: 1}
  - {suite: libero_object_swap, task: 8, seed: 1}
  - {suite: libero_spatial_swap, task: 6, seed: 1}
  - {suite: libero_10_task, task: 6, seed: 1}
  - {suite: libero_goal_task, task: 5, seed: 1}
  - {suite: libero_object_task, task: 9, seed: 1}
  - {suite: libero_spatial_task, task: 9, seed: 1}
concurrency: [4]
episodes_per_level: 16
repeats: 1
episode_timeout_s: 3600
fail_fast: 3
arrival: {mode: closed}
gpu_sampler: true
gpu_interval_s: 0.5
