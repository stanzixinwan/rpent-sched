# G6: cross-episode batching of Pi0.5 calls on the real Flash workload
# (the G5 held-out batch: 16 tasks x seeds 1, 2). scripts/run_g6.sh runs one
# cell per arm (VLA proxy: max_batch 1 = unbatched, greedy, intent-aware
# predict) and level, from this file. Below, the G5 description of the batch.
#
# G5 step 2: JIT-LPT on tasks never used to build or tune anything.
#
# 16 tasks drawn at random (2 per suite, random.Random(2027)) from the 62
# Flash tasks outside G3, so neither the cost table (G2) nor JIT's knob (G3,
# simulator) saw them; 4 of the 8 suites (*_task) were never run at all.
# Seeds 1 and 2: the history table comes from g5_record (seed 0), as a rerun
# with new seeds would have it. 32 episodes, N=8, FIFO queues, shuffled per
# repeat (same order for every arm at a repeat).
#
# Arms (scripts/run_g5.sh): given | jit_lpt with launch.estimate = plan,
# history, or history with half the tasks treated as never run (cold 0.5).
name: g6_batch

rpent:
  robot: libero
  libero_type: pro
  planner: flash
  cuda_device: 0
  extra_args: ["--memory-version", "GPT_5.5_xhigh"]

services:
  vla:
    backend: http://127.0.0.1:9000
    policy: batch          # rsched.batching; run_g6.sh sets max_batch / batch_mode per arm
    max_batch: 1
    batch_mode: greedy
    batch_window_ms: 0
    batch_intent: false
  sam3:
    backend: http://127.0.0.1:9001
    policy: passthrough
  molmo:
    backend: http://127.0.0.1:9002
    policy: priority
    max_inflight: 1

scheduling:
  mode: none

launch:
  rule: given            # per arm: --launch, --estimate, --cold, --history-file
  estimate: plan
  history_file: null
  cold_fraction: 0.0
  cold_seed: 0
  shuffle: true
  seed: 0
  slack: 1.0

episode_env:
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1

episodes:
  list:
    - {suite: libero_10_swap,       task: 1, seed: 1}
    - {suite: libero_goal_swap,     task: 2, seed: 1}
    - {suite: libero_object_swap,   task: 5, seed: 1}
    - {suite: libero_spatial_swap,  task: 4, seed: 1}
    - {suite: libero_10_task,       task: 2, seed: 1}
    - {suite: libero_goal_task,     task: 2, seed: 1}
    - {suite: libero_object_task,   task: 4, seed: 1}
    - {suite: libero_spatial_task,  task: 1, seed: 1}
    - {suite: libero_10_swap,       task: 6, seed: 1}
    - {suite: libero_goal_swap,     task: 9, seed: 1}
    - {suite: libero_object_swap,   task: 8, seed: 1}
    - {suite: libero_spatial_swap,  task: 6, seed: 1}
    - {suite: libero_10_task,       task: 6, seed: 1}
    - {suite: libero_goal_task,     task: 5, seed: 1}
    - {suite: libero_object_task,   task: 9, seed: 1}
    - {suite: libero_spatial_task,  task: 9, seed: 1}
    - {suite: libero_10_swap,       task: 1, seed: 2}
    - {suite: libero_goal_swap,     task: 2, seed: 2}
    - {suite: libero_object_swap,   task: 5, seed: 2}
    - {suite: libero_spatial_swap,  task: 4, seed: 2}
    - {suite: libero_10_task,       task: 2, seed: 2}
    - {suite: libero_goal_task,     task: 2, seed: 2}
    - {suite: libero_object_task,   task: 4, seed: 2}
    - {suite: libero_spatial_task,  task: 1, seed: 2}
    - {suite: libero_10_swap,       task: 6, seed: 2}
    - {suite: libero_goal_swap,     task: 9, seed: 2}
    - {suite: libero_object_swap,   task: 8, seed: 2}
    - {suite: libero_spatial_swap,  task: 6, seed: 2}
    - {suite: libero_10_task,       task: 6, seed: 2}
    - {suite: libero_goal_task,     task: 5, seed: 2}
    - {suite: libero_object_task,   task: 9, seed: 2}
    - {suite: libero_spatial_task,  task: 9, seed: 2}

concurrency: [8, 16]
episodes_per_level: 32
repeats: 1
episode_timeout_s: 3600
# libero_10_task t2 never starts (env_server exits at launch, every seed; 3 of 78
# Flash tasks do this in LIBERO-PRO). Its 2 episodes crash in every cell and every
# arm alike, so cells stay paired; allow them without aborting the sweep.
fail_fast: 3
arrival: {mode: closed}
gpu_sampler: true
gpu_interval_s: 0.5
