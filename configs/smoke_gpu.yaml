# One real episode through the full path: rsched.launch -> proxies -> Pi0.5/SAM3.
# Used by: bash scripts/smoke_test.sh --gpu
name: smoke_gpu

rpent:
  robot: libero
  libero_type: pro
  planner: claude_code
  model: claude-opus-4-8
  cuda_device: 0
  extra_args: ["--memory-version", "GPT_5.5_xhigh", "--claude-code-max-budget-usd", "3", "--max-turns", "20"]

services:
  vla:  {backend: http://127.0.0.1:9000, policy: fifo, max_inflight: 1}
  sam3: {backend: http://127.0.0.1:9001, policy: passthrough}

episodes:
  list:
    - {suite: libero_object_swap, task: 2, seed: 0}

concurrency: [1]
episodes_per_level: 1
episode_timeout_s: 1200
